# waypaper keybindings — comma separated GTK key names.
# Values equal to the built-in defaults are listed so you can tweak them.
[Keybindings]
clear_input_fields = Escape,Return,KP_Enter
quit = q,Escape
clear_cache = r
random_wallpaper = R
hidden_files = period
search = slash
include_subfolders = s
navigation_left = h,Left
navigation_up = k,Up
navigation_down = j,Down
navigation_right = l,Right
choose_folder = f
scroll_to_top = g
scroll_to_bottom = G
zen_mode = z
help_page = question
select_wallpaper = Return,KP_Enter
background {
    monitor =
    path = ~/Pictures/wallpapers/desktop-background.jpg
    blur_passes = 3
    blur_size = 8
    brightness = 0.55
    contrast = 1.0
}

input-field {
    monitor =
    size = 260, 46
    rounding = 12
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.35
    dots_center = true
    outer_color = rgba(168, 85, 247, 1)
    inner_color = rgba(11, 6, 18, 0.90)
    font_color = rgba(224, 208, 255, 1)
    fail_color = rgba(255, 92, 138, 1)
    check_color = rgba(124, 255, 178, 1)
    capslock_color = rgba(192, 132, 252, 1)
    fade_on_empty = false
    placeholder_text = password
    hide_input = false
    position = 0, -40
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +%H:%M
    color = rgba(224, 208, 255, 1)
    font_size = 96
    font_family = JetBrainsMono Nerd Font
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgba(192, 132, 252, 0.85)
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, 60
    halign = center
    valign = center
}